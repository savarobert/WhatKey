name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        type: string
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: whatkey-${{ github.ref_type == 'tag' && github.ref_name || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  SOLUTION: WhatKey.slnx
  APP_PROJECT: WhatKey/WhatKey.csproj
  APP_NAME: WhatKey
  DOTNET_SDK: 10.0.301
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'WhatKey/**/*.csproj', 'WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Build Release
        run: dotnet build "$env:SOLUTION" --configuration Release --no-restore
        shell: pwsh

      - name: Run tests
        run: dotnet test "$env:SOLUTION" --configuration Release --no-build --no-restore
        shell: pwsh

  validate-aot:
    name: Validate Native AOT (${{ matrix.rid }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'WhatKey/**/*.csproj', 'WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Publish Native AOT application
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/aot-$env:RID"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish "$env:APP_PROJECT" --configuration Release --runtime "$env:RID" --no-restore --output $publishDir
          $executableName = if ($env:RID -eq 'win-x64') { "$env:APP_NAME.exe" } else { $env:APP_NAME }
          if (-not (Test-Path (Join-Path $publishDir $executableName))) {
            throw "Native AOT executable was not produced for $env:RID"
          }
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}

  publish-windows:
    name: Publish Windows x64
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      github.event_name == 'workflow_dispatch'
    needs: validate-aot
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'WhatKey/**/*.csproj', 'WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Publish unsigned Windows application
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-x64'
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish "$env:APP_PROJECT" --configuration Release --runtime win-x64 --no-restore --output $publishDir
          Get-ChildItem -Path $publishDir -File |
            Where-Object { $_.Extension -in '.pdb', '.dbg' } |
            Remove-Item -Force
        shell: pwsh

      # Future Windows code signing belongs between publish and packaging.
      - name: Package Windows application
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:APP_NAME-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-x64/*') -DestinationPath $archive -Force
        shell: pwsh

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-win-x64
          path: artifacts/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-linux:
    name: Publish Linux x64
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      github.event_name == 'workflow_dispatch'
    needs: validate-aot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'WhatKey/**/*.csproj', 'WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Publish Linux application
        run: |
          publish_dir="$GITHUB_WORKSPACE/artifacts/linux-x64"
          mkdir -p "$publish_dir"
          dotnet publish "$APP_PROJECT" --configuration Release --runtime linux-x64 --no-restore --output "$publish_dir"
          test -f "$publish_dir/$APP_NAME"
          find "$publish_dir" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          chmod +x "$publish_dir/$APP_NAME"

      - name: Package Linux application
        run: |
          archive="$GITHUB_WORKSPACE/artifacts/$APP_NAME-$RELEASE_TAG-linux-x64.tar.gz"
          tar -C "$GITHUB_WORKSPACE/artifacts/linux-x64" -czf "$archive" .

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-linux-x64
          path: artifacts/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      github.event_name == 'workflow_dispatch'
    needs:
      - publish-windows
      - publish-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -f "release-assets/$APP_NAME-$RELEASE_TAG-win-x64.zip"
          test -f "release-assets/$APP_NAME-$RELEASE_TAG-linux-x64.tar.gz"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() {
            local attempts=5
            local delay=10
            local i status

            for ((i=1; i<=attempts; i++)); do
              if "$@"; then
                return 0
              else
                status=$?
              fi

              if ((i < attempts)); then
                echo "GitHub API command failed (attempt $i/$attempts). Retrying in ${delay} seconds..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            return "$status"
          }

          check_release() {
            local attempts=5
            local delay=10
            local i status response

            for ((i=1; i<=attempts; i++)); do
              if response=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" 2>&1); then
                return 0
              else
                status=$?
              fi

              # A 404 is the only failure that means the release is genuinely missing.
              if [[ "$response" == *"HTTP 404"* ]]; then
                release_missing=true
                return 1
              fi

              echo "GitHub release check failed (attempt $i/$attempts)."
              printf '%s\n' "$response"
              if ((i < attempts)); then
                echo "Retrying in ${delay} seconds..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            return "$status"
          }

          release_missing=false
          if check_release; then
            retry gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_TAG"
          else
            check_status=$?
            if [ "$release_missing" = true ]; then
              retry gh release create "$RELEASE_TAG" --repo "$GH_REPO" --title "$RELEASE_TAG" --generate-notes
            else
              echo "Unable to determine whether GitHub release $RELEASE_TAG exists after retries."
              exit "$check_status"
            fi
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() {
            local attempts=5
            local delay=10
            local i status

            for ((i=1; i<=attempts; i++)); do
              if "$@"; then
                return 0
              else
                status=$?
              fi

              if ((i < attempts)); then
                echo "GitHub API command failed (attempt $i/$attempts). Retrying in ${delay} seconds..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            return "$status"
          }

          retry gh release upload "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            "release-assets/$APP_NAME-$RELEASE_TAG-win-x64.zip" \
            "release-assets/$APP_NAME-$RELEASE_TAG-linux-x64.tar.gz" \
            --clobber
