name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatkey-${{ github.ref_type == 'tag' && github.ref_name || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  SOLUTION: src/WhatKey/WhatKey.slnx
  APP_PROJECT: src/WhatKey/WhatKey.csproj
  APP_NAME: WhatKey
  DOTNET_SDK: 10.0.301

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/global.json', 'src/WhatKey/**/*.csproj', 'src/WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Build Release
        run: dotnet build "$env:SOLUTION" --configuration Release --no-restore
        shell: pwsh

      - name: Run tests
        run: dotnet test "$env:SOLUTION" --configuration Release --no-build --no-restore
        shell: pwsh

  validate-aot:
    name: Validate Native AOT (${{ matrix.rid }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/global.json', 'src/WhatKey/**/*.csproj', 'src/WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Publish Native AOT application
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/aot-$env:RID"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish "$env:APP_PROJECT" --configuration Release --runtime "$env:RID" --no-restore --output $publishDir
          if (-not (Test-Path (Join-Path $publishDir $env:APP_NAME))) {
            throw "Native AOT executable was not produced for $env:RID"
          }
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}

  publish-windows:
    name: Publish Windows x64
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: validate-aot
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/global.json', 'src/WhatKey/**/*.csproj', 'src/WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$env:SOLUTION"
        shell: pwsh

      - name: Publish unsigned Windows application
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-x64'
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish "$env:APP_PROJECT" --configuration Release --runtime win-x64 --no-restore --output $publishDir
          Get-ChildItem -Path $publishDir -File |
            Where-Object { $_.Extension -in '.pdb', '.dbg' } |
            Remove-Item -Force
        shell: pwsh

      # Future Windows code signing belongs between publish and packaging.
      - name: Package Windows application
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:APP_NAME-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-x64/*') -DestinationPath $archive -Force
        shell: pwsh

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-win-x64
          path: artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-linux:
    name: Publish Linux x64
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: validate-aot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/global.json', 'src/WhatKey/**/*.csproj', 'src/WhatKey.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Publish Linux application
        run: |
          publish_dir="$GITHUB_WORKSPACE/artifacts/linux-x64"
          mkdir -p "$publish_dir"
          dotnet publish "$APP_PROJECT" --configuration Release --runtime linux-x64 --no-restore --output "$publish_dir"
          test -f "$publish_dir/$APP_NAME"
          find "$publish_dir" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          chmod +x "$publish_dir/$APP_NAME"

      - name: Package Linux application
        run: |
          archive="$GITHUB_WORKSPACE/artifacts/$APP_NAME-$GITHUB_REF_NAME-linux-x64.tar.gz"
          tar -C "$GITHUB_WORKSPACE/artifacts/linux-x64" -czf "$archive" .

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64
          path: artifacts/${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - publish-windows
      - publish-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.APP_NAME }}-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -f "release-assets/$APP_NAME-$GITHUB_REF_NAME-win-x64.zip"
          test -f "release-assets/$APP_NAME-$GITHUB_REF_NAME-linux-x64.tar.gz"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release-assets/$APP_NAME-$GITHUB_REF_NAME-win-x64.zip" \
            "release-assets/$APP_NAME-$GITHUB_REF_NAME-linux-x64.tar.gz" \
            --clobber
